<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- AdvancedTextPapiJo: simplified H5P selector icon -->
  <!-- Transparent canvas; deliberately bold/simple for small-size rendering. -->

  <!-- Main document -->
  <rect x="92" y="66" width="216" height="270" rx="25"
        fill="#ffffff"/>

  <!-- Text lines -->
  <path d="M126 120 H248" stroke="#65758b" stroke-width="13" stroke-linecap="round"/>
  <path d="M126 158 H229" stroke="#65758b" stroke-width="13" stroke-linecap="round"/>

  <!-- Line containing tooltip-enabled word -->
  <path d="M126 205 H161" stroke="#65758b" stroke-width="13" stroke-linecap="round"/>
  <path d="M178 205 H221" stroke="#ef3153" stroke-width="17" stroke-linecap="round"/>
  <path d="M238 205 H270" stroke="#65758b" stroke-width="13" stroke-linecap="round"/>

  <path d="M126 250 H265" stroke="#65758b" stroke-width="13" stroke-linecap="round"/>
  <path d="M126 289 H228" stroke="#65758b" stroke-width="13" stroke-linecap="round"/>

  <!-- Compact tooltip: white interior with strong blue outline -->
  <path d="M196 80
           H323
           Q339 80 339 96
           V158
           Q339 174 323 174
           H245
           L216 199
           L222 174
           H196
           Q180 174 180 158
           V96
           Q180 80 196 80 Z"
        fill="#ffffff" stroke="#3978d4" stroke-width="6"
        stroke-linejoin="round"/>

  <!-- Tiny image in tooltip -->
  <rect x="198" y="101" width="52" height="43" rx="5"
        fill="#e8f3ff" stroke="#3978d4" stroke-width="3"/>
  <circle cx="237" cy="112" r="7" fill="#ef3153"/>
  <path d="M201 141 L216 122 L229 141 Z" fill="#3978d4"/>
  <path d="M220 141 L233 128 L247 141 Z" fill="#8bb8ef"/>

  <!-- Tooltip text -->
  <path d="M267 113 H317" stroke="#3978d4" stroke-width="9" stroke-linecap="round"/>
  <path d="M267 139 H305" stroke="#3978d4" stroke-width="9" stroke-linecap="round"/>
</svg>
