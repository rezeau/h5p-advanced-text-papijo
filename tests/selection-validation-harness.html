<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AdvancedTextPapiJo selection validation verification</title>
  <script src="/jquery.js"></script>
  <script>
    window.H5PIntegration = { editor: { wysiwygButtons: [] } };
    window.H5PEditor = {
      $: window.H5P.jQuery,
      widgets: {},
      language: {},
      t: function (library, key) {
        const translations = this.language[library];
        return translations && translations.libraryStrings ?
          translations.libraryStrings[key] : key;
      }
    };
    window.ns = window.H5PEditor;
  </script>
  <script src="/ckeditor.js"></script>
  <script src="/h5peditor-html.js"></script>
  <script src="/advanced-text-papijo-tooltip-sanitizer.js"></script>
  <script src="/advanced-text-papijo-tooltip.js"></script>
</head>
<body>
  <div id="fixture"></div>
  <pre id="result">RUNNING</pre>
  <script>
    (async function () {
      const LIBRARY = 'H5PEditor.AdvancedTextPapiJoTooltip';
      const [fields, english] = await Promise.all([
        fetch('/semantics.json').then(function (response) { return response.json(); }),
        fetch('/language/en.json').then(function (response) { return response.json(); })
      ]);
      H5PEditor.language[LIBRARY] = english;
      const fixture = document.getElementById('fixture');
      const results = [];

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message);
        }
      }

      function collectTextContainers(node, containers) {
        const children = Array.from(node.getChildren ? node.getChildren() : []);
        if (children.some(function (child) { return child.is('$text'); })) {
          containers.push(node);
        }
        children.forEach(function (child) {
          if (child.getChildren) {
            collectTextContainers(child, containers);
          }
        });
      }

      function getTextContainers(editor) {
        const containers = [];
        collectTextContainers(editor.model.document.getRoot(), containers);
        return containers;
      }

      function setSelection(editor, range) {
        const containers = getTextContainers(editor);
        editor.model.change(function (writer) {
          writer.setSelection(writer.createRange(
            writer.createPositionAt(containers[range[0]], range[1]),
            writer.createPositionAt(containers[range[2]], range[3])
          ));
        });
      }

      async function openEditor(html) {
        fixture.innerHTML = '<div class="widget-shell"><div class="editor-host"></div></div>';
        const shell = fixture.querySelector('.widget-shell');
        const host = fixture.querySelector('.editor-host');
        host.innerHTML = html;
        const widget = new H5PEditor.AdvancedTextPapiJoTooltip(
          {}, JSON.parse(JSON.stringify(fields[0])), html, function () {}
        );
        const editor = await ClassicEditor.create(host, widget.getCKEditorConfig());
        widget.ckeditor = editor;
        widget.$item = H5PEditor.$(shell);
        widget.$input = H5PEditor.$(host);
        widget.$errors = H5PEditor.$('<div>');
        return { editor: editor, widget: widget };
      }

      async function closeEditor(context) {
        await context.editor.destroy();
        fixture.innerHTML = '';
      }

      async function expectValid(name, html, range, verifyUi) {
        const context = await openEditor(html);
        setSelection(context.editor, range);
        if (verifyUi) {
          context.widget.addTooltipAuthoringControls();
          assert(context.widget.$tooltipStatus.text() === '', name + ': false status message');
          assert(!context.widget.$createTooltipButton.prop('hidden'), name + ': Create action hidden');
        }
        const result = context.editor.execute('createPapijoTooltip', {
          tooltipText: 'Valid selection'
        });
        const output = context.editor.getData();
        assert(result.valid, name + ': selection rejected (' + (result.reason || result.message) + ')');
        assert(output.includes('data-papijo-tooltip="Valid selection"'), name + ': tooltip not created');
        results.push({ name: name, reason: result.reason, output: output });
        await closeEditor(context);
      }

      async function expectInvalid(name, html, range, reason) {
        const context = await openEditor(html);
        setSelection(context.editor, range);
        const original = context.editor.getData();
        const result = context.editor.execute('createPapijoTooltip', {
          tooltipText: 'Rejected selection'
        });
        assert(!result.valid, name + ': invalid selection accepted');
        const modelRange = context.editor.model.document.selection.getFirstRange();
        const diagnostic = {
          startParent: modelRange.start.parent.name,
          endParent: modelRange.end.parent.name,
          items: Array.from(modelRange.getItems()).map(function (item) {
            return item.name || '$text';
          }),
          blocks: Array.from(context.editor.model.document.selection.getSelectedBlocks()).map(function (block) {
            return block.name + ':' + (block.parent && block.parent.name);
          })
        };
        assert(result.reason === reason, name + ': expected ' + reason + ', got ' + result.reason + ' ' + JSON.stringify(diagnostic));
        assert(context.editor.getData() === original, name + ': rejection changed content');
        results.push({ name: name, reason: result.reason, message: result.message });
        await closeEditor(context);
      }

      try {
        await expectValid(
          'two ordinary words in paragraph',
          '<p>one two three</p>', [0, 0, 0, 7], true
        );
        await expectValid(
          'five ordinary words in paragraph',
          '<p>one two three four five six</p>', [0, 0, 0, 23], true
        );
        await expectValid(
          'plain strong plain model runs',
          '<p>selected <strong>formatted</strong> words</p>', [0, 0, 0, 24], true
        );
        await expectValid(
          'selection crossing link boundary',
          '<p>before <a href="https://example.com">linked words</a> after</p>', [0, 0, 0, 25], false
        );
        await expectValid(
          'one word in table cell',
          '<table><tbody><tr><td>one word here</td></tr></tbody></table>', [0, 4, 0, 8], true
        );
        await expectValid(
          'multiple words in same table cell',
          '<table><tbody><tr><td>several selected words here</td></tr></tbody></table>', [0, 0, 0, 22], true
        );
        await expectValid(
          'formatted words in same table cell',
          '<table><tbody><tr><td>selected <strong>formatted</strong> words</td></tr></tbody></table>', [0, 0, 0, 24], true
        );
        await expectValid(
          'multiple words in one list item',
          '<ul><li>several selected words</li><li>other item</li></ul>', [0, 0, 0, 22], false
        );
        await expectValid(
          'multiple words in one heading',
          '<h2>several selected heading words</h2>', [0, 0, 0, 30], false
        );

        await expectInvalid(
          'selection spanning paragraphs',
          '<p>first paragraph</p><p>second paragraph</p>', [0, 2, 1, 6],
          'crossesBlockBoundary'
        );
        await expectInvalid(
          'selection spanning list items',
          '<ul><li>first item</li><li>second item</li></ul>', [0, 2, 1, 6],
          'crossesBlockBoundary'
        );
        await expectInvalid(
          'selection spanning table cells',
          '<table><tbody><tr><td>first cell</td><td>second cell</td></tr></tbody></table>', [0, 2, 1, 6],
          'crossesTableCellBoundary'
        );

        const overlap = '<p>Before <span class="papijo-tooltip" data-papijo-tooltip="Existing">tooltip</span> after</p>';
        await expectInvalid(
          'ordinary into partial tooltip overlap', overlap, [0, 2, 0, 10],
          'crossesTooltipBoundary'
        );
        await expectInvalid(
          'tooltip into ordinary overlap', overlap, [0, 10, 0, 17],
          'crossesTooltipBoundary'
        );
        await expectInvalid(
          'complete tooltip plus ordinary text', overlap, [0, 0, 0, 20],
          'containsTooltip'
        );
        await expectInvalid(
          'selection spanning adjacent tooltips',
          '<p><span class="papijo-tooltip" data-papijo-tooltip="First">first</span><span class="papijo-tooltip" data-papijo-tooltip="Second">second</span></p>',
          [0, 2, 0, 8], 'multipleTooltips'
        );

        assert(results.length === 16, 'Expected 16 results, got ' + results.length);
        document.getElementById('result').textContent = JSON.stringify({
          status: 'PASS', count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'pass';
      }
      catch (error) {
        document.getElementById('result').textContent = JSON.stringify({
          status: 'FAIL', message: error.message, stack: error.stack,
          count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'fail';
      }
    })();
  </script>
</body>
</html>
