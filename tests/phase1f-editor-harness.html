<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AdvancedTextPapiJo Phase 1F editor verification</title>
  <script src="/jquery.js"></script>
  <script>
    window.H5PIntegration = { editor: { wysiwygButtons: [] } };
    window.H5PEditor = {
      $: window.H5P.jQuery,
      widgets: {},
      language: {},
      t: function (library, key) {
        const translations = this.language[library];
        return translations && translations.libraryStrings ?
          translations.libraryStrings[key] : key;
      }
    };
    window.ns = window.H5PEditor;
  </script>
  <script src="/ckeditor.js"></script>
  <script src="/h5peditor-html.js"></script>
  <script src="/advanced-text-papijo-tooltip-sanitizer.js"></script>
  <script src="/advanced-text-papijo-tooltip-selection.js"></script>
  <script src="/advanced-text-papijo-tooltip.js"></script>
</head>
<body>
  <div id="fixture"></div>
  <pre id="result">RUNNING</pre>
  <script>
    (async function () {
      const LIBRARY = 'H5PEditor.AdvancedTextPapiJoTooltip';
      const [semantics, english] = await Promise.all([
        fetch('/semantics.json').then(function (response) { return response.json(); }),
        fetch('/language/en.json').then(function (response) { return response.json(); })
      ]);
      H5PEditor.language[LIBRARY] = english;
      const fixture = document.getElementById('fixture');
      const results = [];
      const Widget = H5PEditor.AdvancedTextPapiJoTooltip;

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message);
        }
      }

      function record(name) {
        results.push({ name: name });
      }

      function collectTextContainers(node, containers) {
        const children = Array.from(node.getChildren ? node.getChildren() : []);
        if (children.some(function (child) { return child.is('$text'); })) {
          containers.push(node);
        }
        children.forEach(function (child) {
          if (child.getChildren) {
            collectTextContainers(child, containers);
          }
        });
      }

      function setSelection(editor, start, end) {
        const containers = [];
        collectTextContainers(editor.model.document.getRoot(), containers);
        editor.model.change(function (writer) {
          writer.setSelection(writer.createRange(
            writer.createPositionAt(containers[0], start),
            writer.createPositionAt(containers[0], end)
          ));
        });
      }

      async function openEditor(html, tooltipImages) {
        fixture.innerHTML = '<div class="widget-shell"><div class="editor-host"></div></div>';
        const shell = fixture.querySelector('.widget-shell');
        const host = fixture.querySelector('.editor-host');
        host.innerHTML = html;
        const parent = { children: [] };
        const widget = new Widget(
          parent, JSON.parse(JSON.stringify(semantics[0])), html, function () {}
        );
        parent.children.push(widget);
        let storedDefinitions = Array.isArray(tooltipImages) ?
          JSON.parse(JSON.stringify(tooltipImages)) : undefined;
        let imageStore = null;
        if (storedDefinitions) {
          imageStore = new Widget.TooltipImagesStore(
            parent,
            semantics[1],
            storedDefinitions,
            function (_field, value) { storedDefinitions = value; }
          );
          parent.children.push(imageStore);
        }
        const editor = await ClassicEditor.create(host, widget.getCKEditorConfig());
        widget.ckeditor = editor;
        widget.$input = H5P.jQuery(host);
        widget.$errors = H5P.jQuery('<div>');
        widget.$item = H5P.jQuery(shell);
        return {
          editor: editor,
          widget: widget,
          imageStore: imageStore,
          getStoredDefinitions: function () { return storedDefinitions; }
        };
      }

      async function closeEditor(context) {
        await context.editor.destroy();
        fixture.innerHTML = '';
      }

      function expectSanitized(name, input, expected) {
        const result = Widget.validateTooltipText(input);
        assert(result.valid && result.text === expected,
          name + ' mismatch: ' + JSON.stringify(result));
        record(name);
      }

      try {
        expectSanitized('plain text', 'Explanation', 'Explanation');
        expectSanitized('em allowed', 'This is <em>important</em>.', 'This is <em>important</em>.');
        expectSanitized('strong allowed', '<strong>important</strong>', '<strong>important</strong>');
        expectSanitized('sup allowed', 'x<sup>2</sup>', 'x<sup>2</sup>');
        expectSanitized('sub allowed', 'H<sub>2</sub>O', 'H<sub>2</sub>O');
        expectSanitized('s allowed', '<s>obsolete</s>', '<s>obsolete</s>');
        expectSanitized('br allowed', 'first line<br>second line', 'first line<br>second line');
        expectSanitized(
          'nested allowed tags',
          '<strong>very <em>important</em></strong>',
          '<strong>very <em>important</em></strong>'
        );
        expectSanitized(
          'disallowed elements unwrapped',
          '<a href="javascript:alert(1)">link</a> <span style="color:red">span</span>',
          'link span'
        );
        expectSanitized(
          'attributes stripped',
          '<strong class="bad" onclick="alert(1)">text</strong>',
          '<strong>text</strong>'
        );
        const scriptOnly = Widget.validateTooltipText('<script>alert(1)<\/script>');
        assert(!scriptOnly.valid, 'Script-only tooltip was accepted');
        const dangerous = Widget.validateTooltipText(
          '<script>alert(1)<\/script><img src=x onerror=alert(1)>safe'
        );
        assert(dangerous.valid && dangerous.text === 'safe',
          'Executable elements were not dropped safely');
        record('script and executable elements dropped');
        expectSanitized(
          'plain special characters',
          'Fish & chips "quoted" \'single\'',
          'Fish & chips "quoted" \'single\''
        );

        let context = await openEditor('<p>Create tooltip through interface</p>');
        setSelection(context.editor, 0, 6);
        context.widget.addTooltipAuthoringControls();
        context.widget.$createTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$createTooltipButton.trigger('click');
        const tooltipControl = context.widget.$tooltipInput[0];
        const tooltipLabel = context.widget.$tooltipForm.find(
          '.papijo-tooltip-authoring-label'
        )[0];
        assert(tooltipControl.tagName === 'TEXTAREA',
          'Tooltip text control was not a textarea');
        assert(tooltipControl.getAttribute('rows') === '2',
          'Tooltip textarea did not use two rows');
        assert(tooltipControl.classList.contains('papijo-tooltip-authoring-input'),
          'Tooltip textarea lost its authoring class');
        assert(tooltipControl.id && document.querySelectorAll(
          '#' + tooltipControl.id
        ).length === 1, 'Tooltip textarea id was missing or not unique');
        assert(tooltipLabel.getAttribute('for') === tooltipControl.id,
          'Tooltip label was not explicitly associated with the textarea');
        assert(context.widget.$tooltipInput.val() === '',
          'Create form did not open with empty tooltip text');
        const createActionLabels = context.widget.$tooltipForm.children('button')
          .map(function () { return this.textContent; }).get();
        assert(JSON.stringify(createActionLabels) ===
          JSON.stringify(['Add tooltip', 'Cancel']) &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 0 && context.widget.$editTooltipButton.prop('hidden'),
        'Create form actions or toolbar state were incorrect');
        context.widget.$tooltipApply.trigger('click');
        assert(!context.widget.$tooltipForm.prop('hidden') &&
          context.widget.$tooltipStatus.text() ===
            'Enter tooltip text or choose an image.' &&
          context.editor.getData() === '<p>Create tooltip through interface</p>',
        'Create empty-content validation message changed');
        record('create actions exclude Remove and retain empty validation message');
        assert(context.widget.$tooltipAltField.prop('hidden'),
          'Create form displayed alternative text without an image');
        context.widget.$tooltipAltInput[0].focus();
        assert(document.activeElement !== context.widget.$tooltipAltInput[0],
          'Hidden alternative text input accepted focus');
        context.widget.$tooltipInput.trigger('focus');
        assert(document.activeElement === tooltipControl,
          'Create form did not focus the tooltip textarea');
        const beforeEnter = context.editor.getData();
        tooltipControl.dispatchEvent(new KeyboardEvent('keydown', {
          key: 'Enter', code: 'Enter', keyCode: 13, which: 13, bubbles: true,
          cancelable: true
        }));
        assert(!context.widget.$tooltipForm.prop('hidden') &&
          context.editor.getData() === beforeEnter,
        'Enter invoked tooltip application');
        record('textarea structure, association, create focus, and Enter behavior');
        context.widget.$tooltipInput.val('Cancelled text');
        context.widget.$tooltipForm.find('.papijo-tooltip-authoring-cancel')
          .trigger('click');
        assert(context.widget.$tooltipForm.prop('hidden') &&
          context.editor.getData() === beforeEnter,
        'Cancel changed tooltip content');
        record('textarea cancel leaves content unchanged');
        await closeEditor(context);

        context = await openEditor('<p>Add tooltip through interface</p>');
        setSelection(context.editor, 0, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$createTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$createTooltipButton.trigger('click');
        context.widget.$tooltipInput.val('Added explicitly');
        context.widget.$tooltipApply.trigger('click');
        assert(context.widget.$tooltipForm.prop('hidden') &&
          context.editor.getData().includes(
            'data-papijo-tooltip="Added explicitly"'
          ), 'Clicking Add did not apply tooltip text');
        record('clicking Add explicitly saves tooltip text');
        await closeEditor(context);

        context = await openEditor('<p>Create formatted tooltip</p>');
        setSelection(context.editor, 7, 16);
        let operation = context.editor.execute('createPapijoTooltip', {
          tooltipText: 'A <strong>very important</strong> term'
        });
        let output = context.editor.getData();
        assert(operation.valid && output.includes(
          'data-papijo-tooltip="A &lt;strong&gt;very important&lt;/strong&gt; term"'
        ), 'Formatted creation was not attribute-encoded safely: ' + output);
        record('text-only tooltip remains valid');

        setSelection(context.editor, 9, 12);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        assert(context.widget.$tooltipInput.val() ===
          'A <strong>very important</strong> term', 'Edit input did not load markup');
        record('edit input loads restricted markup');
        context.widget.$tooltipInput.val('H<sub>2</sub>O and x<sup>2</sup>');
        context.widget.$tooltipApply.trigger('click');
        output = context.editor.getData();
        assert(output.includes('H&lt;sub&gt;2&lt;/sub&gt;O and x&lt;sup&gt;2&lt;/sup&gt;') &&
          context.widget.$tooltipForm.prop('hidden') &&
          !context.widget.$editTooltipButton.prop('hidden') &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 0,
          'Formatted edit was not stored');
        record('clicking Update saves edited tooltip text');

        context.editor.execute('undo');
        const undone = context.editor.getData();
        context.editor.execute('redo');
        const redone = context.editor.getData();
        assert(undone.includes('A &lt;strong&gt;very important&lt;/strong&gt; term'),
          'Undo did not restore formatted metadata');
        assert(redone === output, 'Redo did not restore formatted edit');
        record('formatted edit undo and redo');

        const saved = context.widget.validate();
        await closeEditor(context);
        context = await openEditor(saved);
        assert(context.editor.getData() === saved, 'Formatted tooltip changed on reopen');
        record('formatted save and reopen');
        await closeEditor(context);

        context = await openEditor('<p>Image only tooltip</p>');
        setSelection(context.editor, 0, 5);
        operation = context.editor.execute('createPapijoTooltip', {
          tooltipId: 'image-only-test', tooltipText: ''
        });
        assert(operation.valid && context.editor.getData().includes(
          'data-papijo-tooltip-id="image-only-test"'
        ), 'Image-only tooltip was rejected');
        record('image-only tooltip remains valid');
        await closeEditor(context);

        context = await openEditor('<p>Text and image tooltip</p>');
        setSelection(context.editor, 0, 4);
        operation = context.editor.execute('createPapijoTooltip', {
          tooltipId: 'text-image-test', tooltipText: 'Combined'
        });
        assert(operation.valid && context.editor.getData().includes(
          'data-papijo-tooltip="Combined"'
        ) && context.editor.getData().includes(
          'data-papijo-tooltip-id="text-image-test"'
        ), 'Text-plus-image tooltip was rejected');
        record('text-plus-image tooltip remains valid');
        await closeEditor(context);

        context = await openEditor('<p>Empty tooltip</p>');
        setSelection(context.editor, 0, 5);
        operation = context.editor.execute('createPapijoTooltip', {
          tooltipText: ''
        });
        assert(!operation.valid && !context.editor.getData().includes(
          'papijo-tooltip'
        ), 'Empty tooltip without an image was accepted');
        record('empty tooltip without image remains invalid');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Old" ' +
          'data-papijo-tooltip-id="stable-image">term</span></p>'
        );
        setSelection(context.editor, 1, 3);
        operation = context.editor.execute('editPapijoTooltip', {
          tooltipText: 'New text'
        });
        output = context.editor.getData();
        assert(operation.valid && output.includes('data-papijo-tooltip-id="stable-image"') &&
          output.includes('data-papijo-tooltip="New text"'),
          'Text edit did not preserve image association: ' + output);
        record('text edit preserves image association');

        operation = context.editor.execute('editPapijoTooltip', {
          tooltipId: null,
          tooltipText: 'Text remains'
        });
        output = context.editor.getData();
        assert(operation.valid && operation.id === null &&
          output.includes('data-papijo-tooltip="Text remains"') &&
          !output.includes('data-papijo-tooltip-id'),
          'Image removal did not return the resulting association: ' + output);
        context.editor.execute('undo');
        assert(context.editor.getData().includes('data-papijo-tooltip-id="stable-image"'),
          'Undo did not restore image annotation id');
        context.editor.execute('redo');
        let storedDefinitions = [{
          id: 'stable-image', image: { path: 'images/stable.png' }, alt: 'Stable'
        }];
        let store = new Widget.TooltipImagesStore(
          { params: { text: context.editor.getData() } }, semantics[1],
          storedDefinitions, function (_field, value) { storedDefinitions = value; }
        );
        store.validate();
        assert(storedDefinitions === undefined,
          'Image removal did not clean its orphaned definition on validation');
        record('image removal retains text and participates in undo redo');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Remove" ' +
          'data-papijo-tooltip-id="remove-image">term</span></p>'
        );
        setSelection(context.editor, 1, 3);
        operation = context.editor.execute('removePapijoTooltip');
        output = context.editor.getData();
        assert(operation.valid && operation.id === 'remove-image' &&
          !output.includes('papijo-tooltip'),
          'Complete removal did not expose and remove the image association');
        storedDefinitions = [{
          id: 'remove-image', image: { path: 'images/remove.png' }, alt: 'Remove'
        }];
        store = new Widget.TooltipImagesStore(
          { params: { text: output } }, semantics[1], storedDefinitions,
          function (_field, value) { storedDefinitions = value; }
        );
        store.validate();
        assert(storedDefinitions === undefined,
          'Complete removal did not clean its associated image definition');
        record('complete tooltip removal returns associated image id');
        await closeEditor(context);

        const delayedImageWidgets = [];
        H5PEditor.widgets.image = function (_parent, _field, value, setValue) {
          this.field = _field;
          this.value = value;
          this.setValue = setValue;
          this.removed = false;
          this.$editImage = H5P.jQuery('<button>', {
            'class': 'h5p-editing-image-button', text: 'Edit image'
          });
          this.$widgetDom = H5P.jQuery('<div>').append(this.$editImage);
          if (!this.field.disableCopyright) {
            this.$widgetDom.append(H5P.jQuery('<button>', {
              'class': 'h5p-copyright-button', text: 'Edit copyright'
            }));
          }
          if (value && value.path) {
            this.$widgetDom.append(H5P.jQuery('<a>', {
              'class': 'thumbnail', href: '#', text: value.path
            }));
          }
          delayedImageWidgets.push(this);
        };
        H5PEditor.widgets.image.prototype.appendTo = function ($target) {
          this.$widgetDom.appendTo($target);
        };
        H5PEditor.widgets.image.prototype.remove = function () {
          this.removed = true;
          this.$widgetDom.remove();
        };
        H5PEditor.widgets.image.prototype.complete = function (value) {
          this.setValue(semantics[1].field.fields[1], value);
        };

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Existing" ' +
            'data-papijo-tooltip-id="suppressed-image-controls">term</span></p>',
          [{
            id: 'suppressed-image-controls',
            image: {
              path: 'images/existing-controls.png',
              mime: 'image/png',
              copyright: { author: 'Existing author', license: 'CC BY' }
            },
            alt: 'Existing controlled image'
          }]
        );
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        assert(context.widget.tooltipImageWidget.field.disableCopyright === true &&
          context.widget.$tooltipImageField.find(
            '.h5p-editing-image-button, .h5p-copyright-button'
          ).length === 0 &&
          context.widget.$tooltipImageField.find('.thumbnail').length === 1 &&
          context.widget.$tooltipAltInput.val() ===
            'Existing controlled image' &&
          context.widget.tooltipImageDraft.copyright.author ===
            'Existing author',
        'Tooltip image DOM retained unwanted controls or lost image state');
        context.widget.$tooltipApply.trigger('click');
        assert(context.getStoredDefinitions()[0].image.copyright.author ===
          'Existing author' && context.getStoredDefinitions()[0].image.copyright.license ===
          'CC BY',
        'Updating a tooltip stripped existing copyright metadata');
        record('image DOM suppresses edit controls and preserves metadata');
        await closeEditor(context);

        context = await openEditor('<p>First tooltip and second tooltip</p>');
        setSelection(context.editor, 0, 5);
        context.widget.addTooltipAuthoringControls();
        context.widget.captureModelSelection();
        context.widget.openTooltipForm('create');
        const firstImageWidget = delayedImageWidgets.at(-1);
        firstImageWidget.complete({ path: 'images/current.png' });
        assert(context.widget.tooltipImageDraft.path === 'images/current.png' &&
          firstImageWidget.field.disableCopyright === true &&
          firstImageWidget.$editImage.parent().length === 0 &&
          !context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === '' &&
          context.widget.$tooltipAltInput.closest('label')[0] ===
            context.widget.$tooltipAltField[0],
        'Image selection did not show the associated alternative text row');
        record('current image widget callback updates draft');

        context.widget.$tooltipAltInput.val('Unstored temporary alt');
        context.widget.$tooltipForm.find('.papijo-tooltip-authoring-cancel').trigger('click');
        setSelection(context.editor, 18, 24);
        context.widget.captureModelSelection();
        context.widget.openTooltipForm('create');
        const secondImageWidget = delayedImageWidgets.at(-1);
        firstImageWidget.complete({ path: 'images/stale-after-cancel.png' });
        assert(context.widget.tooltipImageDraft === undefined &&
          context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === '',
        'Cancel retained or restored temporary image/alternative text state');
        record('cancelled image widget callback is ignored by next form');

        secondImageWidget.complete({ path: 'images/second.png' });
        assert(context.widget.tooltipImageDraft.path === 'images/second.png',
          'Second image widget callback did not update its own draft');
        context.widget.$tooltipAltInput.val('Preserved draft alt');
        secondImageWidget.complete(undefined);
        assert(context.widget.tooltipImageDraft === undefined &&
          context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === 'Preserved draft alt',
        'Image removal changed the existing alternative text lifecycle');
        record('image removal hides row while preserving temporary alt text');
        secondImageWidget.complete({ path: 'images/different-after-removal.png' });
        assert(context.widget.tooltipImageDraft.path ===
          'images/different-after-removal.png' &&
          !context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === '',
        'Alternative text migrated to a different image selected after removal');
        record('different image after removal clears preserved alternative text');
        context.widget.$tooltipAltInput.val('New image draft alt');
        context.widget.mountTooltipImageWidget();
        const replacementImageWidget = delayedImageWidgets.at(-1);
        secondImageWidget.complete({ path: 'images/stale-after-remount.png' });
        assert(context.widget.tooltipImageDraft.path ===
          'images/different-after-removal.png',
          'Replaced image widget callback changed the remounted draft');
        replacementImageWidget.complete({
          path: 'images/different-after-removal.png'
        });
        assert(context.widget.$tooltipAltInput.val() === 'New image draft alt',
          'Same-image callback cleared its alternative text');
        record('same-image callback preserves alternative text');
        replacementImageWidget.complete({ path: 'images/replacement.png' });
        assert(context.widget.tooltipImageDraft.path === 'images/replacement.png' &&
          !context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === '',
        'Image replacement changed alternative text visibility or value');
        record('remount ignores stale callback and different replacement clears alt');

        context.widget.destroyTooltipImageWidget();
        replacementImageWidget.complete({ path: 'images/stale-after-destroy.png' });
        assert(context.widget.tooltipImageDraft === undefined,
          'Destroyed image widget callback restored a cleared draft');
        record('widget destruction invalidates delayed callback');

        context.widget.captureModelSelection();
        context.widget.openTooltipForm('create');
        const removedEditorImageWidget = delayedImageWidgets.at(-1);
        context.widget.remove();
        removedEditorImageWidget.complete({ path: 'images/stale-after-editor-remove.png' });
        assert(context.widget.tooltipImageDraft === undefined,
          'Removed editor widget accepted a delayed image callback');
        record('full editor widget removal invalidates delayed callback');
        await context.editor.destroy();
        fixture.innerHTML = '';

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Text only">term</span></p>'
        );
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        const editActionLabels = context.widget.$tooltipForm.children('button')
          .map(function () { return this.textContent; }).get();
        assert(context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$editTooltipButton.prop('hidden') &&
          JSON.stringify(editActionLabels) === JSON.stringify([
            'Update tooltip', 'Cancel', 'Remove tooltip'
          ]) && context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 1,
        'Text-only edit actions, order, or toolbar state were incorrect');
        record('text-only edit uses ordered actions and hides toolbar Edit');
        context.widget.$tooltipInput.val('');
        context.widget.$tooltipApply.trigger('click');
        assert(!context.widget.$tooltipForm.prop('hidden') &&
          context.widget.$tooltipStatus.text() ===
            'Enter tooltip text or choose an image (or Remove tooltip).' &&
          context.editor.getData().includes('data-papijo-tooltip="Text only"') &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 1,
        'Text-only empty edit did not retain the form and Remove action');
        record('empty text-only edit uses extended validation message');
        context.widget.$tooltipForm.find('.papijo-tooltip-authoring-cancel')
          .trigger('click');
        assert(context.widget.$tooltipForm.prop('hidden') &&
          !context.widget.$editTooltipButton.prop('hidden') &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 0,
        'Cancel did not restore the text-only tooltip action state');
        record('Cancel restores Edit and removes the form-only Remove action');
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        assert(context.widget.$tooltipForm.find(
          '.papijo-tooltip-authoring-remove'
        ).length === 1, 'Repeated edit duplicated or lost the Remove action');
        context.widget.$tooltipInput.val('Updated text only');
        context.widget.$tooltipApply.trigger('click');
        assert(context.editor.getData().includes(
          'data-papijo-tooltip="Updated text only"'
        ) && !context.widget.$editTooltipButton.prop('hidden') &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 0,
        'Repeated edit/update did not restore a single toolbar state');
        record('repeated edit cancel edit update cycle remains single-instance');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="" ' +
            'data-papijo-tooltip-id="edit-image-only">term</span></p>',
          [{
            id: 'edit-image-only',
            image: { path: 'images/edit-image-only.png' },
            alt: 'Existing image-only alt'
          }]
        );
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        assert(!context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === 'Existing image-only alt',
        'Image-only edit did not restore and show alternative text');
        record('image-only edit restores visible alternative text');
        context.widget.$tooltipForm.find('.papijo-tooltip-authoring-cancel')
          .trigger('click');
        assert(!context.widget.$editTooltipButton.prop('hidden') &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 0,
        'Image-only Cancel did not restore the toolbar state');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Clear me" ' +
            'data-papijo-tooltip-id="empty-edit-image">term</span></p>',
          [{
            id: 'empty-edit-image',
            image: { path: 'images/empty-edit.png' },
            alt: 'Empty edit alt'
          }]
        );
        const beforeEmptyEdit = context.editor.getData();
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        const emptyEditImageWidget = delayedImageWidgets.at(-1);
        emptyEditImageWidget.complete(undefined);
        context.widget.$tooltipInput.val('');
        context.widget.$tooltipApply.trigger('click');
        assert(!context.widget.$tooltipForm.prop('hidden') &&
          context.widget.$tooltipStatus.text() ===
            'Enter tooltip text or choose an image (or Remove tooltip).' &&
          context.editor.getData() === beforeEmptyEdit &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 1,
        'Image removal plus empty text did not use edit-specific validation');
        record('empty image edit rejects Update and keeps Remove available');
        context.widget.$removeTooltipButton.trigger(
          H5P.jQuery.Event('mousedown')
        );
        context.widget.$removeTooltipButton.trigger('click');
        assert(!context.editor.getData().includes('papijo-tooltip') &&
          context.widget.$tooltipForm.prop('hidden') &&
          context.widget.$editTooltipButton.prop('hidden') &&
          context.widget.$tooltipForm.find(
            '.papijo-tooltip-authoring-remove'
          ).length === 0 && context.getStoredDefinitions().length === 1,
        'Form Remove did not close cleanly through the existing removal path');
        context.editor.execute('undo');
        assert(context.editor.getData().includes(
          'data-papijo-tooltip-id="empty-edit-image"'
        ), 'Form removal was not undoable');
        record('form Remove closes cleanly, defers image cleanup, and is undoable');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Text remains" ' +
            'data-papijo-tooltip-id="edit-remove-image">term</span></p>',
          [{
            id: 'edit-remove-image',
            image: { path: 'images/edit-remove-image.png' },
            alt: 'Existing removal alt'
          }]
        );
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        const removeImageWidget = delayedImageWidgets.at(-1);
        removeImageWidget.complete(undefined);
        assert(context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === 'Existing removal alt',
        'Edit image removal did not hide the row while preserving its value');
        context.widget.$tooltipApply.trigger('click');
        assert(!context.editor.getData().includes('data-papijo-tooltip-id') &&
          context.getStoredDefinitions().length === 1,
        'Update changed the established deferred image-definition cleanup');
        context.imageStore.parent.params = { text: context.editor.getData() };
        context.imageStore.validate();
        assert(context.getStoredDefinitions() === undefined,
          'Validation did not clean the image definition after removal');
        record('edit image removal preserves deferred cleanup semantics');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Unchanged" ' +
            'data-papijo-tooltip-id="unchanged-image">term</span></p>',
          [{
            id: 'unchanged-image',
            image: { path: 'images/unchanged.png' },
            alt: 'Unchanged image alt'
          }]
        );
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        const unchangedWidget = delayedImageWidgets.at(-1);
        unchangedWidget.complete({ path: 'images/unchanged.png' });
        context.widget.$tooltipApply.trigger('click');
        assert(context.getStoredDefinitions()[0].image.path ===
          'images/unchanged.png' &&
          context.getStoredDefinitions()[0].alt === 'Unchanged image alt',
        'Update changed alternative text for an unchanged image');
        record('unchanged existing image preserves stored alternative text');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Caption" ' +
            'data-papijo-tooltip-id="edit-combined">term</span></p>',
          [{
            id: 'edit-combined',
            image: { path: 'images/edit-combined.png' },
            alt: 'Existing combined alt'
          }]
        );
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        assert(!context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === 'Existing combined alt',
        'Text-plus-image edit did not restore and show alternative text');
        record('text-plus-image edit restores visible alternative text');
        const combinedWidget = delayedImageWidgets.at(-1);
        combinedWidget.complete({ path: 'images/replaced-combined.png' });
        assert(!context.widget.$tooltipAltField.prop('hidden') &&
          context.widget.$tooltipAltInput.val() === '',
        'Different image replacement did not clear alternative text');
        context.widget.$tooltipAltInput.val('Replacement image alt');
        context.widget.$tooltipApply.trigger('click');
        assert(context.getStoredDefinitions()[0].image.path ===
          'images/replaced-combined.png' &&
          context.getStoredDefinitions()[0].alt === 'Replacement image alt',
        'Update did not store replacement image alternative text');
        record('edit image replacement clears then stores new alternative text');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Cancel" ' +
            'data-papijo-tooltip-id="cancel-image">term</span></p>',
          [{
            id: 'cancel-image',
            image: { path: 'images/cancel-original.png' },
            alt: 'Cancel original alt'
          }]
        );
        const beforeCancelData = context.editor.getData();
        const beforeCancelDefinitions = JSON.stringify(
          context.getStoredDefinitions()
        );
        setSelection(context.editor, 1, 3);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        const cancelWidget = delayedImageWidgets.at(-1);
        cancelWidget.complete({ path: 'images/cancel-replacement.png' });
        assert(context.widget.$tooltipAltInput.val() === '',
          'Replacement did not clear alternative text before Cancel');
        context.widget.$tooltipAltInput.val('Cancelled replacement alt');
        context.widget.$tooltipForm.find('.papijo-tooltip-authoring-cancel')
          .trigger('click');
        assert(context.editor.getData() === beforeCancelData &&
          JSON.stringify(context.getStoredDefinitions()) ===
            beforeCancelDefinitions,
        'Cancel persisted temporary image or alternative text changes');
        record('cancel preserves stored image and alternative text');
        await closeEditor(context);

        storedDefinitions = [{
          id: 'nested-retained',
          image: { path: 'images/nested-retained.png', mime: 'image/png' },
          alt: 'Nested retained'
        }];
        store = new Widget.TooltipImagesStore({
          params: {
            library: 'H5P.AdvancedTextPapiJo 1.1',
            params: {
              text: '<p><span class="papijo-tooltip" data-papijo-tooltip="Nested" ' +
                'data-papijo-tooltip-id="nested-retained">term</span></p>',
              tooltipImages: storedDefinitions
            }
          }
        }, semantics[1], storedDefinitions,
        function (_field, value) { storedDefinitions = value; });
        store.validate();
        assert(storedDefinitions && storedDefinitions.length === 1 &&
          storedDefinitions[0].id === 'nested-retained',
          'Nested library validation incorrectly removed a referenced definition');
        record('nested library validation retains referenced image definition');

        assert(results.length === 49, 'Expected 49 results, got ' + results.length);
        document.getElementById('result').textContent = JSON.stringify({
          status: 'PASS', count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'pass';
      }
      catch (error) {
        document.getElementById('result').textContent = JSON.stringify({
          status: 'FAIL', message: error.message, stack: error.stack,
          count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'fail';
      }
    })();
  </script>
</body>
</html>
