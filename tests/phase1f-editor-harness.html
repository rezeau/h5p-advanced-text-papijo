<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AdvancedTextPapiJo Phase 1F editor verification</title>
  <script src="/jquery.js"></script>
  <script>
    window.H5PIntegration = { editor: { wysiwygButtons: [] } };
    window.H5PEditor = {
      $: window.H5P.jQuery,
      widgets: {},
      language: {},
      t: function (library, key) {
        const translations = this.language[library];
        return translations && translations.libraryStrings ?
          translations.libraryStrings[key] : key;
      }
    };
    window.ns = window.H5PEditor;
  </script>
  <script src="/ckeditor.js"></script>
  <script src="/h5peditor-html.js"></script>
  <script src="/advanced-text-papijo-tooltip-sanitizer.js"></script>
  <script src="/advanced-text-papijo-tooltip-selection.js"></script>
  <script src="/advanced-text-papijo-tooltip.js"></script>
</head>
<body>
  <div id="fixture"></div>
  <pre id="result">RUNNING</pre>
  <script>
    (async function () {
      const LIBRARY = 'H5PEditor.AdvancedTextPapiJoTooltip';
      const [semantics, english] = await Promise.all([
        fetch('/semantics.json').then(function (response) { return response.json(); }),
        fetch('/language/en.json').then(function (response) { return response.json(); })
      ]);
      H5PEditor.language[LIBRARY] = english;
      const fixture = document.getElementById('fixture');
      const results = [];
      const Widget = H5PEditor.AdvancedTextPapiJoTooltip;

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message);
        }
      }

      function record(name) {
        results.push({ name: name });
      }

      function collectTextContainers(node, containers) {
        const children = Array.from(node.getChildren ? node.getChildren() : []);
        if (children.some(function (child) { return child.is('$text'); })) {
          containers.push(node);
        }
        children.forEach(function (child) {
          if (child.getChildren) {
            collectTextContainers(child, containers);
          }
        });
      }

      function setSelection(editor, start, end) {
        const containers = [];
        collectTextContainers(editor.model.document.getRoot(), containers);
        editor.model.change(function (writer) {
          writer.setSelection(writer.createRange(
            writer.createPositionAt(containers[0], start),
            writer.createPositionAt(containers[0], end)
          ));
        });
      }

      async function openEditor(html) {
        fixture.innerHTML = '<div class="widget-shell"><div class="editor-host"></div></div>';
        const shell = fixture.querySelector('.widget-shell');
        const host = fixture.querySelector('.editor-host');
        host.innerHTML = html;
        const widget = new Widget(
          {}, JSON.parse(JSON.stringify(semantics[0])), html, function () {}
        );
        const editor = await ClassicEditor.create(host, widget.getCKEditorConfig());
        widget.ckeditor = editor;
        widget.$input = H5P.jQuery(host);
        widget.$errors = H5P.jQuery('<div>');
        widget.$item = H5P.jQuery(shell);
        return { editor: editor, widget: widget };
      }

      async function closeEditor(context) {
        await context.editor.destroy();
        fixture.innerHTML = '';
      }

      function expectSanitized(name, input, expected) {
        const result = Widget.validateTooltipText(input);
        assert(result.valid && result.text === expected,
          name + ' mismatch: ' + JSON.stringify(result));
        record(name);
      }

      try {
        expectSanitized('plain text', 'Explanation', 'Explanation');
        expectSanitized('em allowed', 'This is <em>important</em>.', 'This is <em>important</em>.');
        expectSanitized('strong allowed', '<strong>important</strong>', '<strong>important</strong>');
        expectSanitized('sup allowed', 'x<sup>2</sup>', 'x<sup>2</sup>');
        expectSanitized('sub allowed', 'H<sub>2</sub>O', 'H<sub>2</sub>O');
        expectSanitized('s allowed', '<s>obsolete</s>', '<s>obsolete</s>');
        expectSanitized('br allowed', 'first line<br>second line', 'first line<br>second line');
        expectSanitized(
          'nested allowed tags',
          '<strong>very <em>important</em></strong>',
          '<strong>very <em>important</em></strong>'
        );
        expectSanitized(
          'disallowed elements unwrapped',
          '<a href="javascript:alert(1)">link</a> <span style="color:red">span</span>',
          'link span'
        );
        expectSanitized(
          'attributes stripped',
          '<strong class="bad" onclick="alert(1)">text</strong>',
          '<strong>text</strong>'
        );
        const scriptOnly = Widget.validateTooltipText('<script>alert(1)<\/script>');
        assert(!scriptOnly.valid, 'Script-only tooltip was accepted');
        const dangerous = Widget.validateTooltipText(
          '<script>alert(1)<\/script><img src=x onerror=alert(1)>safe'
        );
        assert(dangerous.valid && dangerous.text === 'safe',
          'Executable elements were not dropped safely');
        record('script and executable elements dropped');
        expectSanitized(
          'plain special characters',
          'Fish & chips "quoted" \'single\'',
          'Fish & chips "quoted" \'single\''
        );

        let context = await openEditor('<p>Create formatted tooltip</p>');
        setSelection(context.editor, 7, 16);
        let operation = context.editor.execute('createPapijoTooltip', {
          tooltipText: 'A <strong>very important</strong> term'
        });
        let output = context.editor.getData();
        assert(operation.valid && output.includes(
          'data-papijo-tooltip="A &lt;strong&gt;very important&lt;/strong&gt; term"'
        ), 'Formatted creation was not attribute-encoded safely: ' + output);
        record('create formatted tooltip');

        setSelection(context.editor, 9, 12);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        assert(context.widget.$tooltipInput.val() ===
          'A <strong>very important</strong> term', 'Edit input did not load markup');
        record('edit input loads restricted markup');
        context.widget.$tooltipInput.val('H<sub>2</sub>O and x<sup>2</sup>');
        context.widget.$tooltipForm.trigger('submit');
        output = context.editor.getData();
        assert(output.includes('H&lt;sub&gt;2&lt;/sub&gt;O and x&lt;sup&gt;2&lt;/sup&gt;'),
          'Formatted edit was not stored');
        record('edit formatted tooltip');

        context.editor.execute('undo');
        const undone = context.editor.getData();
        context.editor.execute('redo');
        const redone = context.editor.getData();
        assert(undone.includes('A &lt;strong&gt;very important&lt;/strong&gt; term'),
          'Undo did not restore formatted metadata');
        assert(redone === output, 'Redo did not restore formatted edit');
        record('formatted edit undo and redo');

        const saved = context.widget.validate();
        await closeEditor(context);
        context = await openEditor(saved);
        assert(context.editor.getData() === saved, 'Formatted tooltip changed on reopen');
        record('formatted save and reopen');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Old" ' +
          'data-papijo-tooltip-id="stable-image">term</span></p>'
        );
        setSelection(context.editor, 1, 3);
        operation = context.editor.execute('editPapijoTooltip', {
          tooltipText: 'New text'
        });
        output = context.editor.getData();
        assert(operation.valid && output.includes('data-papijo-tooltip-id="stable-image"') &&
          output.includes('data-papijo-tooltip="New text"'),
          'Text edit did not preserve image association: ' + output);
        record('text edit preserves image association');

        operation = context.editor.execute('editPapijoTooltip', {
          tooltipId: null,
          tooltipText: 'Text remains'
        });
        output = context.editor.getData();
        assert(operation.valid && operation.id === null &&
          output.includes('data-papijo-tooltip="Text remains"') &&
          !output.includes('data-papijo-tooltip-id'),
          'Image removal did not return the resulting association: ' + output);
        context.editor.execute('undo');
        assert(context.editor.getData().includes('data-papijo-tooltip-id="stable-image"'),
          'Undo did not restore image annotation id');
        context.editor.execute('redo');
        let storedDefinitions = [{
          id: 'stable-image', image: { path: 'images/stable.png' }, alt: 'Stable'
        }];
        let store = new Widget.TooltipImagesStore(
          { params: { text: context.editor.getData() } }, semantics[1],
          storedDefinitions, function (_field, value) { storedDefinitions = value; }
        );
        store.validate();
        assert(storedDefinitions === undefined,
          'Image removal did not clean its orphaned definition on validation');
        record('image removal retains text and participates in undo redo');
        await closeEditor(context);

        context = await openEditor(
          '<p><span class="papijo-tooltip" data-papijo-tooltip="Remove" ' +
          'data-papijo-tooltip-id="remove-image">term</span></p>'
        );
        setSelection(context.editor, 1, 3);
        operation = context.editor.execute('removePapijoTooltip');
        output = context.editor.getData();
        assert(operation.valid && operation.id === 'remove-image' &&
          !output.includes('papijo-tooltip'),
          'Complete removal did not expose and remove the image association');
        storedDefinitions = [{
          id: 'remove-image', image: { path: 'images/remove.png' }, alt: 'Remove'
        }];
        store = new Widget.TooltipImagesStore(
          { params: { text: output } }, semantics[1], storedDefinitions,
          function (_field, value) { storedDefinitions = value; }
        );
        store.validate();
        assert(storedDefinitions === undefined,
          'Complete removal did not clean its associated image definition');
        record('complete tooltip removal returns associated image id');
        await closeEditor(context);

        const delayedImageWidgets = [];
        H5PEditor.widgets.image = function (_parent, _field, value, setValue) {
          this.value = value;
          this.setValue = setValue;
          this.removed = false;
          delayedImageWidgets.push(this);
        };
        H5PEditor.widgets.image.prototype.appendTo = function () {};
        H5PEditor.widgets.image.prototype.remove = function () {
          this.removed = true;
        };
        H5PEditor.widgets.image.prototype.complete = function (value) {
          this.setValue(semantics[1].field.fields[1], value);
        };

        context = await openEditor('<p>First tooltip and second tooltip</p>');
        setSelection(context.editor, 0, 5);
        context.widget.addTooltipAuthoringControls();
        context.widget.captureModelSelection();
        context.widget.openTooltipForm('create');
        const firstImageWidget = delayedImageWidgets.at(-1);
        firstImageWidget.complete({ path: 'images/current.png' });
        assert(context.widget.tooltipImageDraft.path === 'images/current.png',
          'Current image widget callback did not update its own draft');
        record('current image widget callback updates draft');

        context.widget.$tooltipForm.find('.papijo-tooltip-authoring-cancel').trigger('click');
        setSelection(context.editor, 18, 24);
        context.widget.captureModelSelection();
        context.widget.openTooltipForm('create');
        const secondImageWidget = delayedImageWidgets.at(-1);
        firstImageWidget.complete({ path: 'images/stale-after-cancel.png' });
        assert(context.widget.tooltipImageDraft === undefined,
          'Cancelled image widget callback changed the next tooltip draft');
        record('cancelled image widget callback is ignored by next form');

        secondImageWidget.complete({ path: 'images/second.png' });
        assert(context.widget.tooltipImageDraft.path === 'images/second.png',
          'Second image widget callback did not update its own draft');
        secondImageWidget.complete(undefined);
        assert(context.widget.tooltipImageDraft === undefined,
          'Current image removal did not clear its own draft');
        secondImageWidget.complete({ path: 'images/second.png' });
        context.widget.mountTooltipImageWidget();
        const replacementImageWidget = delayedImageWidgets.at(-1);
        secondImageWidget.complete({ path: 'images/stale-after-remount.png' });
        assert(context.widget.tooltipImageDraft.path === 'images/second.png',
          'Replaced image widget callback changed the remounted draft');
        replacementImageWidget.complete({ path: 'images/replacement.png' });
        assert(context.widget.tooltipImageDraft.path === 'images/replacement.png',
          'Remounted image widget callback did not update its own draft');
        record('remount invalidates old callback and keeps current callback working');

        context.widget.destroyTooltipImageWidget();
        replacementImageWidget.complete({ path: 'images/stale-after-destroy.png' });
        assert(context.widget.tooltipImageDraft === undefined,
          'Destroyed image widget callback restored a cleared draft');
        record('widget destruction invalidates delayed callback');

        context.widget.captureModelSelection();
        context.widget.openTooltipForm('create');
        const removedEditorImageWidget = delayedImageWidgets.at(-1);
        context.widget.remove();
        removedEditorImageWidget.complete({ path: 'images/stale-after-editor-remove.png' });
        assert(context.widget.tooltipImageDraft === undefined,
          'Removed editor widget accepted a delayed image callback');
        record('full editor widget removal invalidates delayed callback');
        await context.editor.destroy();
        fixture.innerHTML = '';

        storedDefinitions = [{
          id: 'nested-retained',
          image: { path: 'images/nested-retained.png', mime: 'image/png' },
          alt: 'Nested retained'
        }];
        store = new Widget.TooltipImagesStore({
          params: {
            library: 'H5P.AdvancedTextPapiJo 1.1',
            params: {
              text: '<p><span class="papijo-tooltip" data-papijo-tooltip="Nested" ' +
                'data-papijo-tooltip-id="nested-retained">term</span></p>',
              tooltipImages: storedDefinitions
            }
          }
        }, semantics[1], storedDefinitions,
        function (_field, value) { storedDefinitions = value; });
        store.validate();
        assert(storedDefinitions && storedDefinitions.length === 1 &&
          storedDefinitions[0].id === 'nested-retained',
          'Nested library validation incorrectly removed a referenced definition');
        record('nested library validation retains referenced image definition');

        assert(results.length === 26, 'Expected 26 results, got ' + results.length);
        document.getElementById('result').textContent = JSON.stringify({
          status: 'PASS', count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'pass';
      }
      catch (error) {
        document.getElementById('result').textContent = JSON.stringify({
          status: 'FAIL', message: error.message, stack: error.stack,
          count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'fail';
      }
    })();
  </script>
</body>
</html>
