<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>AdvancedTextPapiJo Phase 1F editor verification</title>
  <script src="/jquery.js"></script>
  <script>
    window.H5PIntegration = { editor: { wysiwygButtons: [] } };
    window.H5PEditor = {
      $: window.H5P.jQuery,
      widgets: {},
      language: {},
      t: function (library, key) {
        const translations = this.language[library];
        return translations && translations.libraryStrings ?
          translations.libraryStrings[key] : key;
      }
    };
    window.ns = window.H5PEditor;
  </script>
  <script src="/ckeditor.js"></script>
  <script src="/h5peditor-html.js"></script>
  <script src="/advanced-text-papijo-tooltip-sanitizer.js"></script>
  <script src="/advanced-text-papijo-tooltip.js"></script>
</head>
<body>
  <div id="fixture"></div>
  <pre id="result">RUNNING</pre>
  <script>
    (async function () {
      const LIBRARY = 'H5PEditor.AdvancedTextPapiJoTooltip';
      const [semantics, english] = await Promise.all([
        fetch('/semantics.json').then(function (response) { return response.json(); }),
        fetch('/language/en.json').then(function (response) { return response.json(); })
      ]);
      H5PEditor.language[LIBRARY] = english;
      const fixture = document.getElementById('fixture');
      const results = [];
      const Widget = H5PEditor.AdvancedTextPapiJoTooltip;

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message);
        }
      }

      function record(name) {
        results.push({ name: name });
      }

      function collectTextContainers(node, containers) {
        const children = Array.from(node.getChildren ? node.getChildren() : []);
        if (children.some(function (child) { return child.is('$text'); })) {
          containers.push(node);
        }
        children.forEach(function (child) {
          if (child.getChildren) {
            collectTextContainers(child, containers);
          }
        });
      }

      function setSelection(editor, start, end) {
        const containers = [];
        collectTextContainers(editor.model.document.getRoot(), containers);
        editor.model.change(function (writer) {
          writer.setSelection(writer.createRange(
            writer.createPositionAt(containers[0], start),
            writer.createPositionAt(containers[0], end)
          ));
        });
      }

      async function openEditor(html) {
        fixture.innerHTML = '<div class="widget-shell"><div class="editor-host"></div></div>';
        const shell = fixture.querySelector('.widget-shell');
        const host = fixture.querySelector('.editor-host');
        host.innerHTML = html;
        const widget = new Widget(
          {}, JSON.parse(JSON.stringify(semantics[0])), html, function () {}
        );
        const editor = await ClassicEditor.create(host, widget.getCKEditorConfig());
        widget.ckeditor = editor;
        widget.$input = H5P.jQuery(host);
        widget.$errors = H5P.jQuery('<div>');
        widget.$item = H5P.jQuery(shell);
        return { editor: editor, widget: widget };
      }

      async function closeEditor(context) {
        await context.editor.destroy();
        fixture.innerHTML = '';
      }

      function expectSanitized(name, input, expected) {
        const result = Widget.validateTooltipText(input);
        assert(result.valid && result.text === expected,
          name + ' mismatch: ' + JSON.stringify(result));
        record(name);
      }

      try {
        expectSanitized('plain text', 'Explanation', 'Explanation');
        expectSanitized('em allowed', 'This is <em>important</em>.', 'This is <em>important</em>.');
        expectSanitized('strong allowed', '<strong>important</strong>', '<strong>important</strong>');
        expectSanitized('sup allowed', 'x<sup>2</sup>', 'x<sup>2</sup>');
        expectSanitized('sub allowed', 'H<sub>2</sub>O', 'H<sub>2</sub>O');
        expectSanitized('s allowed', '<s>obsolete</s>', '<s>obsolete</s>');
        expectSanitized('br allowed', 'first line<br>second line', 'first line<br>second line');
        expectSanitized(
          'nested allowed tags',
          '<strong>very <em>important</em></strong>',
          '<strong>very <em>important</em></strong>'
        );
        expectSanitized(
          'disallowed elements unwrapped',
          '<a href="javascript:alert(1)">link</a> <span style="color:red">span</span>',
          'link span'
        );
        expectSanitized(
          'attributes stripped',
          '<strong class="bad" onclick="alert(1)">text</strong>',
          '<strong>text</strong>'
        );
        const scriptOnly = Widget.validateTooltipText('<script>alert(1)<\/script>');
        assert(!scriptOnly.valid, 'Script-only tooltip was accepted');
        const dangerous = Widget.validateTooltipText(
          '<script>alert(1)<\/script><img src=x onerror=alert(1)>safe'
        );
        assert(dangerous.valid && dangerous.text === 'safe',
          'Executable elements were not dropped safely');
        record('script and executable elements dropped');
        expectSanitized(
          'plain special characters',
          'Fish & chips "quoted" \'single\'',
          'Fish & chips "quoted" \'single\''
        );

        let context = await openEditor('<p>Create formatted tooltip</p>');
        setSelection(context.editor, 7, 16);
        let operation = context.editor.execute('createPapijoTooltip', {
          tooltipText: 'A <strong>very important</strong> term'
        });
        let output = context.editor.getData();
        assert(operation.valid && output.includes(
          'data-papijo-tooltip="A &lt;strong&gt;very important&lt;/strong&gt; term"'
        ), 'Formatted creation was not attribute-encoded safely: ' + output);
        record('create formatted tooltip');

        setSelection(context.editor, 9, 12);
        context.widget.addTooltipAuthoringControls();
        context.widget.$editTooltipButton.trigger(H5P.jQuery.Event('mousedown'));
        context.widget.$editTooltipButton.trigger('click');
        assert(context.widget.$tooltipInput.val() ===
          'A <strong>very important</strong> term', 'Edit input did not load markup');
        record('edit input loads restricted markup');
        context.widget.$tooltipInput.val('H<sub>2</sub>O and x<sup>2</sup>');
        context.widget.$tooltipForm.trigger('submit');
        output = context.editor.getData();
        assert(output.includes('H&lt;sub&gt;2&lt;/sub&gt;O and x&lt;sup&gt;2&lt;/sup&gt;'),
          'Formatted edit was not stored');
        record('edit formatted tooltip');

        context.editor.execute('undo');
        const undone = context.editor.getData();
        context.editor.execute('redo');
        const redone = context.editor.getData();
        assert(undone.includes('A &lt;strong&gt;very important&lt;/strong&gt; term'),
          'Undo did not restore formatted metadata');
        assert(redone === output, 'Redo did not restore formatted edit');
        record('formatted edit undo and redo');

        const saved = context.widget.validate();
        await closeEditor(context);
        context = await openEditor(saved);
        assert(context.editor.getData() === saved, 'Formatted tooltip changed on reopen');
        record('formatted save and reopen');
        await closeEditor(context);

        assert(results.length === 17, 'Expected 17 results, got ' + results.length);
        document.getElementById('result').textContent = JSON.stringify({
          status: 'PASS', count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'pass';
      }
      catch (error) {
        document.getElementById('result').textContent = JSON.stringify({
          status: 'FAIL', message: error.message, stack: error.stack,
          count: results.length, results: results
        }, null, 2);
        document.documentElement.dataset.testStatus = 'fail';
      }
    })();
  </script>
</body>
</html>
